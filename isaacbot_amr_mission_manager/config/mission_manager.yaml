/**:
  mission_manager:
    ros__parameters:
      tree_name: IsaacbotMission
      timer_frequency: 20.0
      bt_server_port: 4444

      # Plain BehaviorTree.CPP plugins. is_motion_locked_bt_node is built by isaacbot_amr_navigation
      # and installed into lib/, where BT::SharedLibrary finds it by name.
      plugin_libs:
        - is_motion_locked_bt_node

      # BehaviorTree plugins that need the ROS node handle. Empty by default: the shipped tree
      # does not call Nav 2 (see behavior_trees/isaacbot_amr_mission.xml for why). To add Nav 2 calls
      # to the tree, list nav2_behavior_tree's prebuilt plugins here, e.g.
      #   - nav2_navigate_to_pose_action_bt_node
      #   - nav2_navigate_through_poses_action_bt_node
      # and read the note about double-dispatch in the tree file first.
      #
      # Left unset rather than written as `ros_plugin_libs: []`: an empty YAML sequence
      # has no inferable element type, and rcl rejects it at load time with
      # "Invalid parameter value ... Contains no value". The parameter's own default
      # is already an empty string_array.

      # isaacbot_amr_drive_mode: missions run only in AUTOMATIC.
      drive_mode_topic: drive_mode
      require_automatic_drive_mode: true

      motion_lock_topic: motion_lock
      motion_lock_timeout: 0.5

      # isaacbot_amr_battery publishes here; the old default `battery` matched nothing, so the
      # abort threshold never fired.
      battery_topic: battery/battery_status
      abort_battery_fraction: 0.10

      # isaacbot_amr_rs16_lidar's only health signal is this diagnostic_updater task -- it exposes no
      # service, no lifecycle transition and no boolean "lidar ok" topic. A dead lidar is a
      # hold, not an abort: the costmaps stop being trustworthy, but the mission resumes on
      # the same waypoint once it comes back.
      #
      # require_lidar stays false so a isaacbot booted with ISAACBOT_AMR_SYSTEM_USE_LIDAR=false still runs
      # missions. Set it true on a isaacbot that always carries a lidar.
      lidar_health_topic: diagnostics
      lidar_status_name: "isaacbot_amr_rs16_lidar_node: Lidar status"
      lidar_health_timeout: 3.0
      require_lidar: false

      navigate_to_pose_action: navigate_to_pose

      # Empty means "derive <namespace>/map", Nav 2's global frame.
      goal_frame_id: ""

      mission_status_topic: mission_status
      mission_state_topic: mission_state

      ros_communication_timeout:
        availability: 2.0
        response: 1.0
